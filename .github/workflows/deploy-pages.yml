name: Deploy to GitHub Pages

# Publishes the static build: demo albums and shared-album links work for
# anyone, on any device. The Google Photos source is deliberately absent here,
# because the helper it needs has no login and must stay on a home network.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; let an in-flight deploy finish rather than cancel it.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test before publishing
        run: npm test

      - name: Build for GitHub Pages
        env:
          VITE_BASE: /${{ github.event.repository.name }}/
          VITE_STATIC_HOSTING: 'true'
          VITE_REPO_URL: ${{ github.server_url }}/${{ github.repository }}
        run: npm run build

      # Pages serves 404.html for unknown paths; point it at the app.
      - name: SPA fallback
        run: cp dist/index.html dist/404.html

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
